# Runs this action on its own pull requests. Requires an ANTHROPIC_API_KEY repository secret.
name: AI review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no API key is configured
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: ./
        if: steps.key.outputs.present == 'true'
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
